# Build and test on all three platforms.
#
# This exists because both defects found in review so far were Windows
# packaging faults that no test could see: the library built as
# `libctc_beam_decoder.dll` where the binding looks for
# `ctc_beam_decoder.dll`, and a multi-config generator writing it into a
# subdirectory nothing searches. Both would have failed here on the first
# push, and neither could fail on a developer's macOS machine.
#
# The KenLM build is exercised on Linux only. It is a from-source C++ build
# with a different workaround on each platform, and making it a gate on all
# three would trade the thing these jobs are for — a fast, reliable signal on
# the packaging seam — for the least portable step in the project. The
# without-KenLM matrix is what has to stay green everywhere.
name: ci

# Pull requests from any branch, and main after a merge.
#
# Naming feature branches here was wrong twice over. They are transient — one
# of the two listed is already merged — so the list needs editing every time a
# branch appears or goes, and a branch nobody remembered to add gets no checks
# at all. And a branch that is listed *and* has a pull request open runs
# everything twice, which is what happened: one push produced a `push` run and
# a `pull_request` run, for the same commit and the same answer.
#
# `pull_request` with no filter covers every branch that matters without being
# told about it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time. Pushing three times in quick succession — which
# is how fixing a red build actually goes — otherwise leaves three full
# matrices running to completion, and only the last one's answer is wanted.
# Superseded runs are cancelled rather than finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-reference.txt

      - name: Install test dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Install the reference implementation
        # Only where it can be installed cheaply. pyctcdecode pins numpy<2,
        # and numpy 1.26 has no Windows wheel for Python 3.13 — so on Windows
        # pip builds it from source for ten minutes and produces a numpy that
        # crashes on import. That is the defect this library was written to
        # escape, and it accounted for 94% of every job's runtime.
        #
        # The comparison tests skip without it. What still runs everywhere is
        # the part these jobs are for: that the library builds, is named what
        # the binding expects, lands where it looks, loads, and decodes.
        if: runner.os == 'Linux'
        run: python -m pip install --quiet -r requirements-reference.txt

      - name: Configure and build
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release -DCTCBD_WITH_KENLM=OFF
          cmake --build build/cmake --config Release -j 2

      - name: Show what was built
        # Listed explicitly: a wrongly named or wrongly placed library should
        # be visible here rather than only as a later import failure.
        shell: bash
        run: ls -R build/cmake | head -40

      - name: Test
        run: python -m pytest tests/ -q

      - name: Load the installed library from a clean prefix
        # The check the build tree cannot perform: CMake strips the build-tree
        # rpath on install, so an installed library that cannot find its
        # neighbours passes every other test here.
        shell: bash
        # The build from the step above, not a fresh one configured with
        # different options.
        run: ./scripts/check-install.sh build/cmake

  with-language-model:
    name: ubuntu-latest, KenLM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-reference.txt

      - name: Install test dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Install the reference implementation
        # A separate step because it downgrades numpy, which pip will do
        # but will not do to satisfy a contradictory pin in one file.
        run: python -m pip install --quiet -r requirements-reference.txt

      - name: Fetch KenLM sources
        run: ./scripts/fetch-kenlm.sh

      - name: Build the KenLM Python bindings
        # Needed only so pyctcdecode has a language model to be compared
        # against; nothing here ships them.
        #
        # Built from the sources fetched above rather than from a fresh
        # download, so the bindings and the linked library are the same pinned
        # commit. classroom-captions' setup.sh pulls kenlm master unpinned for
        # this, which is worth aligning.
        #
        # The regeneration is not optional on Python 3.13: kenlm ships a
        # kenlm.cpp generated by an old Cython, which references _PyGC_FINALIZED
        # and _PyDict_SetItem_KnownHash — both removed from the C API. Without
        # this the install fails with several hundred lines of C++ errors that
        # read like a broken kenlm rather than a stale generated file.
        run: |
          python -m pip install --quiet setuptools "cython>=3.0"
          cython third_party/kenlm/python/kenlm.pyx --cplus \
            -o third_party/kenlm/python/kenlm.cpp
          CC=gcc CXX=g++ CXXFLAGS=-Wno-deprecated-declarations \
            python -m pip install --quiet --no-build-isolation third_party/kenlm

      - name: Configure and build
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --config Release -j 2

      - name: Test
        # Nothing should skip here. A skip would mean the library was built
        # without KenLM after being asked for it, which is the failure this
        # job exists to catch.
        run: python -m pytest tests/ -q -rs

      - name: Load the installed library from a clean prefix
        run: ./scripts/check-install.sh build/cmake

      - name: What the tests would catch
        # A green suite says what passes. This says what it would notice,
        # which is the question three shipped defects answered badly.
        run: python tools/mutation_audit.py
