# Build the shipping binaries and attach them to a release.
#
# The consumer is classroom-captions, which pins every native asset by
# checksum and downloads it with an unauthenticated curl — libparakeet, the
# VAD models, the language model. These bundles deliberately follow the same
# shape as libparakeet's so that download-assets.sh treats them the same way:
# one archive per platform, containing a directory named after the archive,
# containing the libraries.
#
# Two libraries per bundle, not one. The decoder finds KenLM beside itself by
# a relative path — @loader_path on macOS, $ORIGIN on Linux, same-directory on
# Windows — so shipping them together is what makes that resolution work.
# Splitting them would mean the consumer had to know about the dependency.
#
# check-install.sh gates every platform. It installs to a clean prefix and
# loads the result with no library search path set, which is the only check
# that can see the two packaging faults this project has already had: a
# wrongly named DLL, and one written into a per-configuration subdirectory.
# A build tree cannot fail either of them.
name: release

on:
  push:
    tags: ["v*"]


  # For rehearsing the build without cutting a release. Produces the same
  # artifacts and checksums, attaches nothing.
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.bundle }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is arm64 only, matching libparakeet, which ships no Intel
          # bundle either. Linux arm64 is deliberately absent: nothing in this
          # project has ever run on it, and shipping a binary nobody has
          # tested is worse than not shipping one.
          - os: macos-14
            bundle: macos-arm64
            ext: tar.gz
            libs: libctc_beam_decoder.dylib libkenlm.dylib
            wheel_tag: macosx_14_0_arm64
          # ubuntu-22.04 rather than ubuntu-latest, deliberately.
          #
          # v0.1.0 was built on ubuntu-latest — 24.04 — and would not load on
          # 22.04 at all: "libstdc++.so.6: version `GLIBCXX_3.4.32' not found".
          # 22.04 is an LTS supported until 2027, and Debian 12 and RHEL 9 sit
          # in the same bracket.
          #
          # Static libstdc++ (see CMakeLists.txt) handles the C++ runtime, but
          # glibc itself cannot be statically linked sanely, and its symbol
          # versions are decided by the build machine. So the rule for a
          # distributable is to build against the OLDEST libc you intend to
          # support, not the newest available. `ubuntu-latest` is a moving
          # target that silently raises the floor whenever GitHub rolls it
          # forward — which is exactly how this happened.
          - os: ubuntu-22.04
            bundle: linux-x64
            ext: tar.gz
            libs: libctc_beam_decoder.so libkenlm.so
            # manylinux_2_35 is Ubuntu 22.04's glibc. Claiming an older tag
            # would be the same lie in metadata that the GLIBCXX failure was in
            # the binary — pip would install it somewhere it cannot run.
            wheel_tag: manylinux_2_35_x86_64
          - os: windows-latest
            bundle: win-x64
            ext: zip
            libs: ctc_beam_decoder.dll kenlm.dll
            wheel_tag: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch KenLM sources
        shell: bash
        run: ./scripts/fetch-kenlm.sh

      - name: Build
        shell: bash
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --config Release -j 2

      - name: Check the installed artifact loads
        shell: bash
        run: ./scripts/check-install.sh build/cmake

      - name: Stage the bundle
        shell: bash
        # From the install, never from the build tree.
        #
        # They are not the same binary. CMake gives a build-tree library an
        # rpath pointing at the absolute path of the build directory, and
        # replaces it with @loader_path/$ORIGIN only on install. Shipping the
        # build-tree copy produces something that works on the machine that
        # built it and cannot find KenLM anywhere else — which is the same
        # fault that already got through once, reintroduced at the packaging
        # step. Rehearsing this workflow by hand is how it was caught.
        #
        # Named after the archive, as libparakeet's bundles are, so the
        # consumer's extraction logic is the same for both.
        run: |
          cmake --install build/cmake --prefix dist/staging --config Release
          STEM="ctc-beam-decoder-${GITHUB_REF_NAME}-${{ matrix.bundle }}"
          echo "STEM=$STEM" >> "$GITHUB_ENV"
          mkdir -p "dist/$STEM"
          for lib in ${{ matrix.libs }}; do
            found="$(find dist/staging -name "$lib" -print -quit)"
            if [ -z "$found" ]; then
              echo "::error::$lib is not in the install tree; nothing to ship"
              find dist/staging -type f | head -40
              exit 1
            fi
            cp "$found" "dist/$STEM/"
          done
          cp include/ctc_beam_decoder.h LICENSE NOTICE "dist/$STEM/"
          # The Python binding travels with the library it binds.
          #
          # It declares the ABI version it expects and refuses to load a
          # library that reports a different one — which only helps if the two
          # cannot drift apart in the first place. Shipping them in one
          # archive makes skew impossible rather than merely detectable, and
          # means the consumer pins one checksum instead of coordinating two.
          cp -R python/ctc_beam_decoder "dist/$STEM/"
          find "dist/$STEM" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          ls -lR "dist/$STEM"

      - name: Refuse to ship a path from this runner
        shell: bash
        # A library carrying the build directory's absolute path resolves its
        # neighbour only here. Cheap to check, and the failure it prevents
        # appears as "works for me" on every subsequent report.
        run: |
          lib="dist/$STEM/$(echo '${{ matrix.libs }}' | cut -d' ' -f1)"
          case "$(uname -s)" in
            Darwin)
              otool -l "$lib" | grep -A2 LC_RPATH | grep 'path ' || true
              if otool -l "$lib" | grep -q "path ${GITHUB_WORKSPACE}"; then
                echo "::error::$lib carries this runner's build path"
                exit 1
              fi ;;
            Linux)
              readelf -d "$lib" | grep -E 'RPATH|RUNPATH' || true
              if readelf -d "$lib" | grep -E 'RPATH|RUNPATH' | grep -q "${GITHUB_WORKSPACE}"; then
                echo "::error::$lib carries this runner's build path"
                exit 1
              fi ;;
            *) echo "    no embedded search paths on this platform" ;;
          esac

      # Build the wheel from the same staged libraries the archive ships.
      #
      # Deliberately not from the build tree: the staged copies are the ones
      # with @loader_path/$ORIGIN rpaths rather than this runner's absolute
      # build path, and they have just been checked for that two steps above.
      # A wheel built from build/cmake would be the "works on the machine that
      # built it" fault again, wearing a different hat.
      #
      # The libraries go *inside* the package directory. The binding's search
      # order already looks there first — `here / name`, commented as the
      # installed-package case — so nothing in the Python changes.
      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          for lib in ${{ matrix.libs }}; do
            cp "dist/$STEM/$lib" python/ctc_beam_decoder/
          done
          python -m pip install --quiet build wheel
          python -m build --wheel --outdir dist/wheel-raw
          # hatchling produces py3-none-any because nothing here is compiled by
          # Python's toolchain — but the wheel contains a platform-specific
          # binary, so an `any` tag would let pip install the macOS wheel on
          # Windows. Retagged to what it actually is.
          python -m wheel tags --remove \
            --platform-tag "${{ matrix.wheel_tag }}" \
            dist/wheel-raw/*.whl
          mkdir -p dist/wheels
          mv dist/wheel-raw/*.whl dist/wheels/
          ls -l dist/wheels

      # A wheel that imports on the machine that built it is the minimum bar,
      # and it catches the two things most likely to be wrong: the libraries
      # not actually landing inside the package, and the ABI version check
      # failing because binding and binary drifted apart.
      - name: The wheel installs and imports
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/wheeltest
          if [ -f /tmp/wheeltest/bin/python ]; then PY=/tmp/wheeltest/bin/python; else PY=/tmp/wheeltest/Scripts/python; fi
          "$PY" -m pip install --quiet dist/wheels/*.whl
          cd /tmp   # never import from the source tree, only from the wheel
          "$PY" -c "import ctc_beam_decoder as d; dec = d.build_ctcdecoder(['a','b','']); print('  wheel imports, decoder constructs:', type(dec).__name__)"

      # pyproject says requires-python >=3.9, and the wheel is tagged
      # py3-none-<platform>, so pip will install it on any of them. Nothing
      # verified that until here: every job above runs 3.13.
      #
      # This is the pyctcdecode mistake in miniature — a version bound asserted
      # rather than measured — and this project exists because of what that cost
      # downstream. The binding is pure ctypes with `from __future__ import
      # annotations`, so there is good reason to believe 3.9 works. Good reason
      # to believe is not the same as tested.
      #
      # One wheel serves every version, so testing it against several
      # interpreters on one platform is enough; Linux is the cheapest.
      - name: The wheel works on every Python version it claims
        if: matrix.bundle == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          for v in 3.9 3.11 3.13 3.14; do
            uv venv --python "$v" "/tmp/pyv-$v" --quiet 2>/dev/null || {
              echo "  $v: interpreter unavailable, skipping"; continue; }
            uv pip install --python "/tmp/pyv-$v" --quiet dist/wheels/*.whl
            (cd /tmp && "/tmp/pyv-$v/bin/python" -c "import ctc_beam_decoder as d; d.build_ctcdecoder(['a','b','']); print('  $v OK')") \
              || { echo "::error::the wheel claims >=3.9 but fails on $v"; exit 1; }
          done

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$STEM.zip" "$STEM" > /dev/null
          else
            tar -czf "$STEM.tar.gz" "$STEM"
          fi
          # The checksum the consumer pins. Printed as well as written, so it
          # is readable from the log without downloading anything.
          if command -v sha256sum > /dev/null; then
            sha256sum "$STEM.${{ matrix.ext }}" | tee "$STEM.${{ matrix.ext }}.sha256"
          else
            shasum -a 256 "$STEM.${{ matrix.ext }}" | tee "$STEM.${{ matrix.ext }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/wheels/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For PyPI Trusted Publishing: GitHub mints a short-lived OIDC token that
      # PyPI verifies against the registered publisher. No API token exists, so
      # there is nothing in repository secrets to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums for download-assets.sh
        # Collected in one place so they can be pasted into the consumer's
        # pinning block without opening three logs.
        run: |
          echo "Paste these into classroom-captions/scripts/download-assets.sh:"
          echo
          cat dist/*.sha256

      - name: Attach to the release
        # Only for a tag. A workflow_dispatch run builds and checksums so the
        # thing can be rehearsed, and publishes nothing.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prebuilt decoder and KenLM libraries. Each bundle carries both: the decoder resolves KenLM beside itself." \
            dist/*.tar.gz dist/*.zip dist/*.sha256

      # Last, and deliberately allowed to fail.
      #
      # By this point the archives, checksums and wheels are already attached to
      # the GitHub release, which is what `classroom-captions` consumes — it
      # pins bundles by checksum and never touches PyPI. So a misconfigured
      # trusted publisher, a name clash or a PyPI outage must not fail a release
      # that is otherwise complete and correct.
      #
      # If this step goes red, the release is still good: the wheels are on the
      # release page and `pip install <url>` works. Fix the publisher and
      # re-run this job.
      - name: Publish wheels to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # dist/ also holds the .tar.gz, .zip and .sha256 bundle artifacts, and
          # this action uploads everything it is pointed at. The upload step
          # preserves the wheels under dist/wheels/, so point at that.
          packages-dir: dist/wheels
          skip-existing: true
          verbose: true
